<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>PandaDoc Search AI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      /* Same transparent margin as the search pill, so the feathered shadow has
         room to fall off instead of being clipped. Kept in sync with fit(). */
      :root {
        --pad-x: 52px;
        --pad-top: 40px;
        --pad-bottom: 88px;
      }
      body {
        font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      /* One surface for the whole panel. The pieces used to float separately over
         a transparent window, which let the contract show through the gaps
         between them and read as three unrelated things; now the input row,
         chips, and answer all sit on this. */
      #wrap {
        border-radius: 22px;
        background: rgba(38, 38, 41, 0.985);
        border: 1px solid rgba(255, 255, 255, 0.1);
        /* Clips the answer's scrollbar and bottom corners to the radius. */
        overflow: hidden;
      }

      /* The shadow stack from the search pill: a hairline contact edge, then
         progressively wider, weaker layers so the falloff has no visible
         boundary. Now carried by the one surface rather than each piece. */
      .float {
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.26),
          0 0 30px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.09),
          0 3px 8px rgba(0, 0, 0, 0.09),
          0 7px 18px rgba(0, 0, 0, 0.1),
          0 14px 38px rgba(0, 0, 0, 0.13),
          0 26px 72px rgba(0, 0, 0, 0.17);
      }

      /* ---- the input row ---- */
      /* Flat now: the surface behind it supplies the background, so this is just
         the row that holds the glyph, the field, and the send button. It stays
         the drag handle for the window. */
      .pill {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 56px;
        padding: 0 12px 0 16px;
      }
      .glyph {
        -webkit-app-region: no-drag;
        flex: none;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(139, 92, 246, 0.22);
      }
      input {
        -webkit-app-region: no-drag;
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #ececed;
        font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: text;
        -webkit-user-select: text;
      }
      input::placeholder { color: rgba(255, 255, 255, 0.42); }

      .tag {
        -webkit-app-region: no-drag;
        flex: none;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.1px;
      }
      .send {
        -webkit-app-region: no-drag;
        flex: none;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 50%;
        /* Violet, so the AI pill reads as a different thing from the emerald
           search pill at a glance. */
        background: #a78bfa;
        cursor: default;
        transition: background 0.12s, opacity 0.12s;
      }
      .send:hover { background: #b9a2fc; }
      .send:disabled { opacity: 0.4; }

      /* The three-dot "working" state replaces the arrow in the same circle. */
      .dots { display: flex; gap: 3px; }
      .dots i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #1f2937;
        animation: pulse 1.1s infinite ease-in-out;
      }
      .dots i:nth-child(2) { animation-delay: 0.15s; }
      .dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.25; }
        40% { opacity: 1; }
      }

      /* ---- attachments pending on the next question ---- */
      .clip {
        -webkit-app-region: no-drag;
        flex: none;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: default;
        transition: background 0.12s;
      }
      .clip:hover { background: rgba(255, 255, 255, 0.09); }
      .clip:disabled { opacity: 0.35; }

      .atts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 14px 10px;
      }
      .atts:empty { display: none; }

      .att {
        display: flex;
        align-items: center;
        gap: 7px;
        max-width: 240px;
        padding: 5px 6px 5px 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.72);
      }
      .att img {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        object-fit: cover;
      }
      /* PDF / TXT badge where an image would show its thumbnail. */
      .att .badge {
        flex: none;
        padding: 2px 5px;
        border-radius: 4px;
        background: rgba(167, 139, 250, 0.22);
        color: #c4b5fd;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .att .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .att .x {
        -webkit-app-region: no-drag;
        flex: none;
        width: 18px;
        height: 18px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: rgba(255, 255, 255, 0.5);
        font: 400 14px -apple-system, BlinkMacSystemFont, sans-serif;
        line-height: 1;
        cursor: default;
      }
      .att .x:hover { background: rgba(255, 255, 255, 0.12); color: #ececed; }

      .attnote {
        padding: 0 16px 10px;
        font-size: 12.5px;
        line-height: 1.45;
        color: #fca5a5;
      }
      .attnote:empty { display: none; }

      /* Dropping a file anywhere on the panel adds it. */
      #wrap.drag { border-color: rgba(167, 139, 250, 0.7); }

      /* ---- the assessment chips, on the surface under the input row ---- */
      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        align-items: center;
        gap: 6px;
        padding: 0 12px 12px;
      }
      .chips:empty { display: none; }
      .chip {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 210px;
        padding: 7px 13px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 999px;
        /* Raised off the surface with a lighter fill instead of a drop shadow —
           on a solid panel a shadow just reads as grime. */
        background: rgba(255, 255, 255, 0.055);
        color: rgba(255, 255, 255, 0.62);
        font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: default;
        transition: background 0.12s, color 0.12s;
      }
      .chip:hover { background: rgba(255, 255, 255, 0.11); color: rgba(255, 255, 255, 0.92); }
      .chip:disabled { opacity: 0.45; }
      .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chip svg { flex: none; opacity: 0.6; }
      .chip.ghost { background: transparent; padding: 7px 11px; }

      /* ---- the answer ---- */
      /* Part of the same surface — only a hairline separates it from the controls
         above, rather than it being its own floating card. */
      .card {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.14);
        color: #dcdcde;
      }
      .card.hidden { display: none; }

      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.4);
      }
      .head .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .head button {
        -webkit-app-region: no-drag;
        flex: none;
        padding: 3px 9px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.5);
        font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: default;
      }
      .head button:hover { background: rgba(255, 255, 255, 0.07); color: rgba(255, 255, 255, 0.85); }

      /* Answers can be long; the card scrolls rather than the window growing
         without limit. The cap is in vh so it tracks the display. */
      .body {
        max-height: 46vh;
        overflow-y: auto;
        padding: 14px 18px 16px;
        font-size: 14.5px;
        line-height: 1.58;
        user-select: text;
        -webkit-user-select: text;
      }
      .body::-webkit-scrollbar { width: 9px; }
      .body::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 99px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      .body h3, .body h4 {
        margin: 15px 0 6px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: rgba(196, 181, 253, 0.92);
      }
      .body h4 { text-transform: none; letter-spacing: 0; font-size: 14px; color: #ececed; }
      .body > *:first-child { margin-top: 0; }
      .body p { margin: 0 0 9px; }
      .body ul, .body ol { margin: 0 0 9px; padding-left: 18px; }
      .body li { margin: 0 0 4px; }
      .body strong { color: #f4f4f5; font-weight: 600; }
      .body code {
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        font: 400 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .body pre {
        margin: 0 0 10px;
        padding: 10px 12px;
        border-radius: 8px;
        overflow-x: auto;
        background: rgba(0, 0, 0, 0.3);
      }
      .body pre code { padding: 0; background: none; }
      .body blockquote {
        margin: 0 0 9px;
        padding-left: 11px;
        border-left: 2px solid rgba(167, 139, 250, 0.45);
        color: rgba(255, 255, 255, 0.7);
      }
      /* Tables come up constantly — "Key terms" asks for one outright. Wide ones
         scroll inside the wrapper rather than stretching the card. */
      .tw { overflow-x: auto; margin: 0 0 11px; }
      .body table { border-collapse: collapse; font-size: 13.5px; }
      .body th, .body td {
        padding: 6px 12px 6px 0;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      .body th { color: rgba(255, 255, 255, 0.5); font-weight: 500; white-space: nowrap; }
      .body hr { margin: 13px 0; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }
      /* A wrapped bullet's continuation line — no second marker for it. */
      .body li.cont { list-style: none; margin-left: -4px; }

      .caret {
        display: inline-block;
        width: 7px;
        height: 15px;
        margin-left: 1px;
        vertical-align: -2px;
        background: rgba(167, 139, 250, 0.9);
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      .err {
        padding: 12px 18px;
        color: #fca5a5;
        font-size: 13.5px;
        line-height: 1.5;
        user-select: text;
        -webkit-user-select: text;
      }

      /* ---- key setup + assessment editor ---- */
      .panel { padding: 16px 18px 18px; }
      .panel h2 {
        margin-bottom: 5px;
        font-size: 14.5px;
        font-weight: 600;
        color: #f4f4f5;
      }
      .panel p {
        margin-bottom: 13px;
        font-size: 13px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.52);
      }
      .panel a { color: #a78bfa; cursor: default; }
      .row { display: flex; gap: 8px; align-items: center; }
      .field {
        -webkit-app-region: no-drag;
        flex: 1;
        min-width: 0;
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 9px;
        background: rgba(0, 0, 0, 0.26);
        color: #ececed;
        font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        outline: 0;
        user-select: text;
        -webkit-user-select: text;
      }
      .field:focus { border-color: rgba(167, 139, 250, 0.6); }
      textarea.field {
        resize: vertical;
        min-height: 74px;
        line-height: 1.5;
        font-size: 13px;
      }
      .btn {
        -webkit-app-region: no-drag;
        flex: none;
        padding: 9px 15px;
        border: 0;
        border-radius: 9px;
        background: #a78bfa;
        color: #1f2937;
        font: 500 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: default;
      }
      .btn:hover { background: #b9a2fc; }
      .btn:disabled { opacity: 0.4; }
      .btn.quiet {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.13);
        color: rgba(255, 255, 255, 0.6);
      }
      .btn.quiet:hover { background: rgba(255, 255, 255, 0.07); color: #ececed; }
      .btn.danger { background: transparent; border: 1px solid rgba(252, 165, 165, 0.3); color: #fca5a5; }
      .btn.danger:hover { background: rgba(252, 165, 165, 0.1); }

      .editor { max-height: 46vh; overflow-y: auto; }
      .item {
        padding: 12px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      .item:first-child { border-top: 0; padding-top: 0; }
      .item .row { margin-bottom: 7px; }
      .foot { display: flex; gap: 8px; justify-content: flex-end; padding-top: 14px; }
      .foot .grow { flex: 1; }
    </style>
  </head>
  <body>
    <div id="wrap" class="float">
      <div class="pill" id="pill">
        <div class="glyph">
          <!-- Sparkle: the same shape the AI button in the overlay uses. -->
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="#c4b5fd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2.4 11.6 7 16.2 8.6 11.6 10.2 10 14.8 8.4 10.2 3.8 8.6 8.4 7Z" />
            <path d="M15.4 13.4 16 15.1 17.7 15.7 16 16.3 15.4 18 14.8 16.3 13.1 15.7 14.8 15.1Z" />
          </svg>
        </div>

        <input id="q" placeholder="Ask about this contract…" spellcheck="false" />

        <div class="tag" id="tag">Claude</div>

        <button class="clip" id="clip" title="Attach a PDF, image, or text file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.62)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l8.49-8.49a3.67 3.67 0 0 1 5.18 5.18l-8.49 8.49a1.83 1.83 0 0 1-2.6-2.6l7.79-7.78" />
          </svg>
        </button>

        <button class="send" id="go" disabled title="Ask">
          <svg id="arrow" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="13" x2="8" y2="3" />
            <polyline points="3.5,7.5 8,3 12.5,7.5" />
          </svg>
          <div class="dots" id="working" hidden><i></i><i></i><i></i></div>
        </button>
      </div>

      <div class="atts" id="atts"></div>
      <div class="attnote" id="attnote"></div>

      <div class="chips" id="chips"></div>

      <div class="card hidden" id="card"></div>
    </div>

    <input
      id="file"
      type="file"
      accept="image/*,application/pdf,text/plain,text/markdown,text/csv,.md,.txt,.csv"
      multiple
      hidden
    />

    <script>
      const q = document.getElementById('q');
      const go = document.getElementById('go');
      const arrow = document.getElementById('arrow');
      const working = document.getElementById('working');
      const tag = document.getElementById('tag');
      const chips = document.getElementById('chips');
      const card = document.getElementById('card');
      const wrap = document.getElementById('wrap');
      const clip = document.getElementById('clip');
      const fileEl = document.getElementById('file');
      const atts_el = document.getElementById('atts');
      const attnote = document.getElementById('attnote');

      let assessments = [];
      let busy = false;
      let answer = '';      // raw text accumulated from the stream
      let streaming = false;
      let view = 'idle';    // idle | answer | error | setup | editor
      let docTitle = '';

      // The contract these answers are about. Compared rather than counted, so
      // leaving a document and coming back to it keeps the thread — only a
      // switch to a DIFFERENT one starts over.
      let contract = null;

      // Bumped by reset(), so a run that was cleared out from under it — a switch
      // mid-stream, the cancel button — knows not to paint what it came back with.
      let runId = 0;

      // Whether to keep following the tail of the answer as it streams. Cleared
      // when you scroll up to read something, set again if you scroll back down.
      let stick = true;

      // Slack for the at-the-bottom test: scrollTop is fractional on retina and
      // lands a pixel or two short, which would otherwise read as "scrolled up"
      // the moment the text reflows.
      const STICK_SLACK = 24;

      const SPARK =
        '<svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M10 2.8 11.5 7 15.7 8.5 11.5 10 10 14.2 8.5 10 4.3 8.5 8.5 7Z"/></svg>';

      // ---- layout -------------------------------------------------------------
      // The window is sized to its content. The scrolling regions are capped in
      // vh, so the window only grows until the card starts scrolling instead.
      function fit() {
        const css = getComputedStyle(document.documentElement);
        const chrome =
          parseFloat(css.getPropertyValue('--pad-top')) +
          parseFloat(css.getPropertyValue('--pad-bottom'));
        window.ai.resize(Math.ceil(wrap.getBoundingClientRect().height) + chrome);
      }

      // ---- a small markdown renderer ------------------------------------------
      // Claude answers in markdown and there's no bundling step here, so this
      // covers what actually shows up: headings, lists, tables, code, emphasis.
      // Everything is escaped before any tag is introduced.
      function esc(s) {
        return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      }

      function inline(s) {
        return esc(s)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      }

      function cells(line) {
        return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
      }

      function isDivider(line) {
        return /^\s*\|?[\s:-]*-[\s|:-]*\|?\s*$/.test(line) && line.includes('-');
      }

      function md(src) {
        const lines = src.split('\n');
        const out = [];
        let list = null;   // open <ul>/<ol> tag name, or null
        let para = [];

        const closeList = () => {
          if (list) { out.push(`</${list}>`); list = null; }
        };
        const closePara = () => {
          if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; }
        };
        const flush = () => { closePara(); closeList(); };

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i].replace(/\s+$/, '');

          // Fenced code — consume through the closing fence verbatim.
          const fence = /^\s*```/.exec(line);
          if (fence) {
            flush();
            const buf = [];
            i += 1;
            while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i += 1; }
            out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
            continue;
          }

          // Pipe table — a header row followed by a |---|---| divider.
          if (line.includes('|') && i + 1 < lines.length && isDivider(lines[i + 1])) {
            flush();
            const header = cells(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
              rows.push(cells(lines[i]));
              i += 1;
            }
            i -= 1;
            out.push(
              '<div class="tw"><table><thead><tr>' +
                header.map((c) => `<th>${inline(c)}</th>`).join('') +
                '</tr></thead><tbody>' +
                rows
                  .map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`)
                  .join('') +
                '</tbody></table></div>'
            );
            continue;
          }

          if (!line.trim()) { flush(); continue; }

          const head = /^(#{1,6})\s+(.*)$/.exec(line);
          if (head) {
            flush();
            // Two levels is all this needs: a section label and a sub-label.
            const level = head[1].length <= 2 ? 3 : 4;
            out.push(`<h${level}>${inline(head[2])}</h${level}>`);
            continue;
          }

          if (/^\s*(?:---+|\*\*\*+|___+)\s*$/.test(line)) {
            flush();
            out.push('<hr />');
            continue;
          }

          const quote = /^\s*>\s?(.*)$/.exec(line);
          if (quote) {
            flush();
            out.push(`<blockquote>${inline(quote[1])}</blockquote>`);
            continue;
          }

          const bullet = /^\s*(?:[-*•+]|(\d+)[.)])\s+(.*)$/.exec(line);
          if (bullet) {
            closePara();
            const want = bullet[1] ? 'ol' : 'ul';
            if (list !== want) { closeList(); out.push(`<${want}>`); list = want; }
            out.push(`<li>${inline(bullet[2])}</li>`);
            continue;
          }

          // A plain line directly under a bullet is that bullet's continuation.
          if (list) { out.push(`<li class="cont">${inline(line)}</li>`); continue; }
          para.push(line.trim());
        }

        flush();
        return out.join('');
      }

      // ---- rendering ----------------------------------------------------------
      function setBusy(on) {
        busy = on;
        working.hidden = !on;
        arrow.style.display = on ? 'none' : '';
        clip.disabled = on;
        go.disabled = on || (!q.value.trim() && !atts.length);
        [...chips.querySelectorAll('button')].forEach((b) => (b.disabled = on));
      }

      function headRow(label, right) {
        return `<div class="head"><span class="grow">${esc(label)}</span>${right || ''}</div>`;
      }

      function renderAnswer(notice) {
        card.classList.remove('hidden');

        // Every delta re-renders the card, which throws the scrolling element
        // away — so where you were reading has to be carried over by hand.
        const prev = document.getElementById('out');
        const wasAt = prev ? prev.scrollTop : 0;

        const label = [docTitle || 'Assessment', notice].filter(Boolean).join('  ·  ');
        card.innerHTML =
          headRow(label, '<button id="copy">Copy</button><button id="clear">New</button>') +
          `<div class="body" id="out">${md(answer)}${streaming ? '<span class="caret"></span>' : ''}</div>`;

        const out = document.getElementById('out');

        // Follow the tail only while you haven't scrolled off it. Text is always
        // appended at the end, so restoring the old offset holds your place.
        if (stick) out.scrollTop = out.scrollHeight;
        else out.scrollTop = wasAt;

        out.addEventListener('scroll', () => {
          const gap = out.scrollHeight - out.scrollTop - out.clientHeight;
          stick = gap <= STICK_SLACK;
        });

        const copy = document.getElementById('copy');
        copy.addEventListener('click', () => {
          navigator.clipboard.writeText(answer).then(() => {
            copy.textContent = 'Copied';
            setTimeout(() => (copy.textContent = 'Copy'), 1200);
          });
        });
        document.getElementById('clear').addEventListener('click', reset);
        fit();
      }

      function renderError(message) {
        view = 'error';
        card.classList.remove('hidden');
        card.innerHTML = headRow('Couldn’t run that') + `<div class="err">${esc(message)}</div>`;
        fit();
      }

      function reset() {
        runId += 1;
        answer = '';
        streaming = false;
        stick = true;
        view = 'idle';
        docTitle = '';
        tag.textContent = 'Claude';
        card.classList.add('hidden');
        card.innerHTML = '';
        q.value = '';
        clearAtts();
        setBusy(false);
        renderChips();
        fit();
        q.focus();
      }

      // ---- the assessment chips ----------------------------------------------
      function renderChips() {
        chips.innerHTML = '';
        if (view === 'setup' || view === 'editor') { fit(); return; }

        assessments.forEach((a) => {
          const b = document.createElement('button');
          b.className = 'chip';
          b.innerHTML = SPARK + '<span></span>';
          b.querySelector('span').textContent = a.name;
          b.title = a.instruction.slice(0, 300);
          // Re-opening the panel mid-answer rebuilds these buttons, so they have
          // to pick the busy state up themselves rather than relying on the
          // setBusy() that ran before they existed.
          b.disabled = busy;
          b.addEventListener('click', () => run({ instruction: a.instruction, label: a.name }));
          chips.appendChild(b);
        });

        const edit = document.createElement('button');
        edit.className = 'chip ghost';
        edit.innerHTML = '<span>Edit…</span>';
        edit.title = 'Add, change, or remove assessments';
        edit.disabled = busy;
        edit.addEventListener('click', showEditor);
        chips.appendChild(edit);

        fit();
      }

      // ---- attachments --------------------------------------------------------
      // Extra context for the question — a prior agreement, an amendment, a
      // screenshot. Ported from Quick Claude: each file is read to base64 here
      // and tagged with a kind the main process turns into a content block.
      // Entries: { id, name, media_type, data, kind, url }.

      const MAX_ATT_BYTES = 20 * 1024 * 1024;  // per file
      const MAX_TOTAL_BYTES = 24 * 1024 * 1024; // the API caps a request at 32MB

      let atts = [];
      let attSeq = 0;

      function attKind(file) {
        if ((file.type || '').startsWith('image/')) return 'image';
        if (file.type === 'application/pdf') return 'document';
        // Some text files arrive with an empty or odd MIME type, so fall back to
        // the extension rather than rejecting them.
        if ((file.type || '').startsWith('text/')) return 'text';
        if (/\.(txt|md|markdown|csv|tsv|json|log)$/i.test(file.name || '')) return 'text';
        return null;
      }

      function note(msg) {
        attnote.textContent = msg || '';
        fit();
      }

      function totalBytes() {
        return atts.reduce((n, a) => n + a.bytes, 0);
      }

      function addFile(file) {
        if (!file) return;

        const kind = attKind(file);
        if (!kind) {
          note(`Can’t attach ${file.name || 'that file'} — PDFs, images, and text files only.`);
          return;
        }
        if (file.size > MAX_ATT_BYTES) {
          note(`${file.name || 'That file'} is too large (max 20 MB).`);
          return;
        }
        if (totalBytes() + file.size > MAX_TOTAL_BYTES) {
          note('That would make the request too large to send. Remove something first.');
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || '');
          atts.push({
            id: ++attSeq,
            name: file.name || (kind === 'image' ? 'pasted-image.png' : 'attachment'),
            media_type: file.type || 'application/octet-stream',
            data: result.slice(result.indexOf(',') + 1),
            bytes: file.size,
            kind,
            url: kind === 'image' ? result : null,
          });
          note('');
          renderAtts();
        };
        reader.onerror = () => note(`Couldn’t read ${file.name || 'that file'}.`);
        reader.readAsDataURL(file);
      }

      function renderAtts() {
        atts_el.innerHTML = '';
        atts.forEach((a) => {
          const el = document.createElement('div');
          el.className = 'att';

          if (a.kind === 'image' && a.url) {
            const img = document.createElement('img');
            img.src = a.url;
            el.appendChild(img);
          } else {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = a.kind === 'document' ? 'PDF' : 'TXT';
            el.appendChild(badge);
          }

          const nm = document.createElement('span');
          nm.className = 'nm';
          nm.textContent = a.name;
          el.appendChild(nm);

          const x = document.createElement('button');
          x.className = 'x';
          x.textContent = '×';
          x.title = `Remove ${a.name}`;
          x.addEventListener('click', () => {
            atts = atts.filter((o) => o.id !== a.id);
            renderAtts();
          });
          el.appendChild(x);

          atts_el.appendChild(el);
        });

        // An attachment on its own is a reason to enable Ask — "what changed?"
        // against the contract is a complete question without any typed text.
        if (!busy) go.disabled = !q.value.trim() && !atts.length;
        fit();
      }

      function clearAtts() {
        atts = [];
        note('');
        renderAtts();
      }

      clip.addEventListener('click', () => fileEl.click());
      fileEl.addEventListener('change', () => {
        Array.from(fileEl.files || []).forEach(addFile);
        fileEl.value = ''; // so the same file can be picked again
      });

      // Electron would navigate the window to a dropped file, so the default is
      // swallowed on every drag event, not just the drop.
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach((name) => {
        document.addEventListener(name, (e) => {
          const hasFiles = Array.from((e.dataTransfer && e.dataTransfer.types) || [])
            .includes('Files');
          if (name === 'drop' || hasFiles) e.preventDefault();
        });
      });

      let dragDepth = 0; // enter/leave fire per descendant; count to avoid flicker
      wrap.addEventListener('dragenter', (e) => {
        if (!Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes('Files')) return;
        dragDepth += 1;
        wrap.classList.add('drag');
      });
      wrap.addEventListener('dragleave', () => {
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) wrap.classList.remove('drag');
      });
      wrap.addEventListener('drop', (e) => {
        dragDepth = 0;
        wrap.classList.remove('drag');
        Array.from((e.dataTransfer && e.dataTransfer.files) || []).forEach(addFile);
      });

      // A pasted screenshot becomes an attachment rather than nothing at all.
      q.addEventListener('paste', (e) => {
        const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
        const files = items
          .filter((it) => it.kind === 'file' && (it.type || '').startsWith('image/'))
          .map((it) => it.getAsFile())
          .filter(Boolean);
        if (!files.length) return;
        e.preventDefault();
        files.forEach(addFile);
      });

      // ---- asking -------------------------------------------------------------
      // `fresh` starts a new thread. An assessment always does; a typed question
      // continues the current one so follow-ups keep the contract in context.
      async function run({ instruction = '', label = '' }) {
        if (busy) return;
        const question = q.value.trim();
        if (!instruction && !question && !atts.length) return;

        // Only the fields the main process needs — the preview URL and local id
        // don't survive IPC structured cloning usefully and aren't wanted there.
        const attachments = atts.map((a) => ({
          name: a.name,
          media_type: a.media_type,
          data: a.data,
          kind: a.kind,
        }));

        const fresh = !!instruction || view !== 'answer';
        if (fresh) answer = '';
        else answer += '\n\n---\n\n';

        docTitle = label || docTitle;
        view = 'answer';
        streaming = true;
        stick = true; // a new answer follows the tail again
        q.value = '';
        setBusy(true);
        renderAnswer('Reading the document…');

        const mine = runId;
        const res = await window.ai.ask({ question, instruction, fresh, attachments });
        // Cleared while this was in flight — the panel has moved on to another
        // contract, or you cancelled. Painting the answer now would put it under
        // a document it isn't about.
        if (mine !== runId) return;

        streaming = false;
        setBusy(false);

        if (res && res.error === 'no-key') { showSetup(); return; }
        if (res && res.error) {
          // Keep a partial answer rather than throwing it away on a late error.
          if (answer.trim()) renderAnswer(res.error);
          else renderError(res.error);
          return;
        }

        // Only now that they're part of the thread's history — a failed turn is
        // popped in the main process, so on error they stay pending for a retry.
        clearAtts();

        if (res && res.title) docTitle = label ? `${label} — ${res.title}` : res.title;
        tag.textContent = (res && res.title) || 'Claude';
        renderAnswer((res && res.notice) || '');
        q.focus();
      }

      window.ai.onDelta((text) => {
        if (!streaming) return;
        answer += text;
        renderAnswer('');
      });

      // ---- key setup ----------------------------------------------------------
      function showSetup() {
        view = 'setup';
        renderChips();
        card.classList.remove('hidden');
        card.innerHTML =
          headRow('Connect Claude') +
          '<div class="panel">' +
          '<h2>Paste an Anthropic API key</h2>' +
          '<p>Assessments run on your own Anthropic account and are billed to it. ' +
          'Create a key at <a id="console">console.anthropic.com</a>, then paste it here — ' +
          'it’s encrypted with your keychain and never leaves this Mac except to call the API.</p>' +
          '<div class="row">' +
          '<input class="field" id="key" type="password" placeholder="sk-ant-…" spellcheck="false" />' +
          '<button class="btn" id="savekey" disabled>Connect</button>' +
          '</div></div>';

        const key = document.getElementById('key');
        const save = document.getElementById('savekey');

        document.getElementById('console').addEventListener('click', () => window.ai.openKeyPage());
        key.addEventListener('input', () => (save.disabled = !key.value.trim()));
        key.addEventListener('keydown', (e) => { if (e.key === 'Enter' && key.value.trim()) commit(); });
        save.addEventListener('click', commit);

        async function commit() {
          const res = await window.ai.saveKey(key.value);
          if (res && res.hasKey) reset();
        }

        fit();
        key.focus();
      }

      // ---- the assessment editor ---------------------------------------------
      // The "skills": a name and the instruction it sends. Editing here writes
      // assessments.json, so they survive updates.
      function showEditor() {
        view = 'editor';
        renderChips();
        const draft = assessments.map((a) => ({ ...a }));

        card.classList.remove('hidden');
        card.innerHTML =
          headRow('Assessments') +
          '<div class="panel"><div class="editor" id="list"></div>' +
          '<div class="foot">' +
          '<button class="btn quiet" id="add">Add</button><span class="grow"></span>' +
          '<button class="btn quiet" id="cancel">Cancel</button>' +
          '<button class="btn" id="save">Save</button>' +
          '</div></div>';

        const list = document.getElementById('list');

        function paint() {
          list.innerHTML = '';
          if (!draft.length) {
            list.innerHTML =
              '<p style="margin:0">No assessments. Add one, or save an empty ' +
              'list to bring the shipped set back.</p>';
          }
          draft.forEach((a, i) => {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML =
              '<div class="row"><input class="field name" placeholder="Name" /></div>' +
              '<div class="row"><textarea class="field text" placeholder="What Claude should do with the contract"></textarea>' +
              '<button class="btn danger del">Remove</button></div>';

            const name = item.querySelector('.name');
            const text = item.querySelector('.text');
            name.value = a.name;
            text.value = a.instruction;
            name.addEventListener('input', () => (draft[i].name = name.value));
            text.addEventListener('input', () => (draft[i].instruction = text.value));
            item.querySelector('.del').addEventListener('click', () => {
              draft.splice(i, 1);
              paint();
            });
            list.appendChild(item);
          });
          fit();
        }

        document.getElementById('add').addEventListener('click', () => {
          draft.push({ name: '', instruction: '' });
          paint();
          const inputs = list.querySelectorAll('.name');
          inputs[inputs.length - 1].focus();
        });
        document.getElementById('cancel').addEventListener('click', reset);
        document.getElementById('save').addEventListener('click', async () => {
          assessments = await window.ai.saveAssessments(draft);
          reset();
        });

        paint();
      }

      // ---- wiring -------------------------------------------------------------
      q.addEventListener('input', () => {
        if (!busy) go.disabled = !q.value.trim() && !atts.length;
      });
      q.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') run({});
        else if (e.key === 'Escape') window.ai.cancel();
      });
      go.addEventListener('click', () => run({}));

      // The transparent shadow margin is still part of the window, so a click out
      // there would land on nothing. Treat it as dismiss, like the search pill.
      document.addEventListener('mousedown', (e) => {
        // The panel is one surface now, so anything inside it counts as a hit —
        // otherwise its own padding would dismiss it.
        if (!e.target.closest('#wrap')) window.ai.cancel();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !e.target.closest('.field')) window.ai.cancel();
      });

      // Whether the panel is now looking at a different contract than the answers
      // on it are about. A missing key is "can't tell", not "a new one" — the
      // panel is dismissed, not cleared, so an answer is only thrown away on a
      // switch we're sure of.
      function switchedContract(key) {
        if (!key || key === contract) return false;
        const had = !!contract;
        contract = key;
        return had;
      }

      // Opened by the hotkey, the overlay button, or `a` over the document.
      window.ai.onOpen((state) => {
        assessments = (state && state.assessments) || [];
        const switched = switchedContract(state && state.contract);
        if (state && !state.hasKey) { showSetup(); return; }
        if (switched || view === 'setup' || view === 'editor') reset();
        else renderChips();
        fit();
        q.focus();
        q.select();
      });

      // The document changed behind a panel that's already up. Its answers are
      // about a contract that has left the screen, and a follow-up typed into it
      // would append under them as though it were the same conversation.
      window.ai.onContract((key) => {
        if (switchedContract(key)) reset();
      });

      window.ai.ready();
      fit();
    </script>
  </body>
</html>
