name: Release

# Builds the Windows installer on a Windows runner and uploads it to the GitHub
# Release for the tag. The macOS build is produced locally instead, because
# signing and notarizing it needs the Developer ID cert in a local keychain.
#
# Push a tag to trigger:  npm version patch && git push --follow-tags

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Publishes nsis installers + latest.yml to the release for this tag.
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
